name: Deploy Frontend

on:
  workflow_dispatch:
    inputs:
      VITE_PUBLIC_POSTHOG_HOST:
        description: "PostHog API Host"
        required: true
        type: string
  workflow_call:
    inputs:
      VITE_PUBLIC_POSTHOG_HOST:
        required: false
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      VITE_PUBLIC_POSTHOG_KEY:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter meal-prep-ui build
        env:
          VITE_PUBLIC_POSTHOG_HOST: ${{ inputs.VITE_PUBLIC_POSTHOG_HOST || vars.VITE_PUBLIC_POSTHOG_HOST }}
          VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_PUBLIC_POSTHOG_KEY }}

      - name: Get commit messages
        id: commit_messages
        env:
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
        run: |
          # Handle manual dispatch (null) and preserve shell safety for arbitrary commit text.
          if [ -z "${COMMITS_JSON:-}" ] || [ "$COMMITS_JSON" = "null" ]; then
            echo "messages=Manual Trigger or No Commits" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MESSAGES=$(jq -r '[.[].message | gsub("\\r?\\n"; " ")] | join("; ")' <<< "$COMMITS_JSON")

          if [ -z "$MESSAGES" ]; then
            MESSAGES="No Commit Messages"
          fi

          echo "messages=$MESSAGES" >> "$GITHUB_OUTPUT"

      # Run the workspace's own pinned wrangler rather than cloudflare/wrangler-action. The action
      # insists on a wrangler version it chooses, does not find ours, and then tries to install its
      # own with `pnpm add` at the workspace root — which pnpm refuses without -w, failing the job.
      #
      # No output directory argument: wrangler.toml supplies pages_build_output_dir, and deploying
      # through the config file is what picks up UI/functions (the /api proxy).
      - name: Deploy to Cloudflare Pages
        working-directory: UI
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          pnpm exec wrangler pages deploy
          --project-name=meal-prep-ui
          --branch=main
          --commit-hash=${{ github.sha }}
          --commit-message="${{ steps.commit_messages.outputs.messages }}"
          --commit-dirty=true
