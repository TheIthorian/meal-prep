<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Meal Prep - Recipe Shopping Lists</title>
        <meta
            name="description"
            content="Meal Prep helps you save recipes, import recipes from the web, and turn ingredients into shopping lists."
        />
        <meta name="author" content="Meal Prep" />

        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

        <!--
            The two faces every page paints with. Without these the browser only discovers them
            after it has downloaded and parsed the stylesheet, which is itself render-blocking.
            The latin-ext subsets are deliberately not preloaded: they are only fetched when a page
            actually contains characters in that range.
        -->
        <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="preload" href="/fonts/dm-serif-display-latin.woff2" as="font" type="font/woff2" crossorigin />

        <meta property="og:title" content="Meal Prep - Recipe Shopping Lists" />
        <meta
            property="og:description"
            content="Save recipes, pull recipes from the web, and build shopping lists from ingredients."
        />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Meal Prep" />
        <meta property="og:url" content="https://meal-prep-ui.pages.dev/" />
        <meta property="og:image" content="https://meal-prep-ui.pages.dev/og-image.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="Meal Prep: recipes in, shopping list out - a shopping list with ingredients from three recipes."
        />

        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Meal Prep - Recipe Shopping Lists" />
        <meta
            name="twitter:description"
            content="Save recipes, pull recipes from the web, and build shopping lists from ingredients."
        />
        <meta name="twitter:image" content="https://meal-prep-ui.pages.dev/og-image.png" />
